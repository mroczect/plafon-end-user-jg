<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Database Harga Motor - Filter Kolom</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="resources/css/style.css">
  <link rel="shortcut icon" href="resources/favicon/favicon.svg" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1><i class="fas fa-motorcycle"></i> Plafon End User Juragan Gadai</h1>
      <p><i class="fas fa-database"></i> Data dari resources/data/table.csv</p>
    </header>

    <div id="loading"><i class="fas fa-spinner fa-pulse"></i> Memuat data...</div>

    <div id="table-container" style="display: none;">
      <div class="table-wrapper">
        <table id="motor-table">
          <thead id="table-header"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div class="toolbar">
        <span id="info-counter"><i class="fas fa-chart-simple"></i> 0 data</span>
        <button id="reset-filters"><i class="fas fa-arrows-rotate"></i> Reset semua filter</button>
      </div>
    </div>

    <footer>
      <div class="credit">
        Dibuat oleh Muhammad Riduwan Khafidi |
        <a href="https://github.com/mroczect/plafon-end-user-jg" target="_blank"><i class="fab fa-github"></i> github.com/mroczect/plafon-end-user-jg.git</a>
      </div>
    </footer>
  </div>

  <script src="resources/js/scripts.js"></script>
</body>
</html>
