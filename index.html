<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Database Harga Motor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse untuk CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="shortcut icon" href="./resources/favicon/favicon.svg" type="image/x-icon">
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
      <!-- Header -->
      <div
        class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"
      >
        <div>
          <h1
            class="text-2xl sm:text-3xl font-bold text-slate-900 flex items-center gap-3"
          >
            <i data-lucide="database" class="w-8 h-8 text-blue-600"></i>
            Plafon End User Juragan Gadai
          </h1>
          <p class="text-slate-500 text-sm mt-1 ml-11">
            Sumber data ./resources/data/table.csv
          </p>
        </div>
        <div class="flex gap-2">
          <button
            id="toggleFilterBtn"
            class="sm:hidden px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium shadow-sm hover:bg-slate-50 flex items-center gap-2 transition"
          >
            <i data-lucide="filter" class="w-4 h-4"></i> Filter
          </button>
          <button
            id="exportCsvBtn"
            class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium shadow-sm hover:bg-slate-50 flex items-center gap-2 transition"
          >
            <i data-lucide="download" class="w-4 h-4"></i> Export Filter
          </button>
        </div>
      </div>

      <!-- Panel Filter & Statistik -->
      <div
        id="filterPanel"
        class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6 hidden sm:block"
      >
        <div class="p-5">
          <div
            class="flex flex-col lg:flex-row gap-4 justify-between items-start lg:items-end"
          >
            <!-- Kiri: Filter -->
            <div class="flex flex-wrap gap-3 items-end w-full lg:w-auto">
              <div class="w-48">
                <label
                  class="block text-xs font-semibold text-slate-500 uppercase mb-1.5"
                  >Filter Merk</label
                >
                <select
                  id="merkFilter"
                  class="w-full px-3 py-2 border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-slate-50"
                >
                  <option value="SEMUA">Semua Merk</option>
                </select>
              </div>
              <div class="w-56">
                <label
                  class="block text-xs font-semibold text-slate-500 uppercase mb-1.5"
                  >Sortir Harga Terbaru</label
                >
                <select
                  id="sortHarga"
                  class="w-full px-3 py-2 border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-slate-50"
                >
                  <option value="none">Default (Tanpa Sortir)</option>
                  <option value="asc">Termurah → Termahal</option>
                  <option value="desc">Termahal → Termurah</option>
                </select>
              </div>
              <div class="w-36">
                <label
                  class="block text-xs font-semibold text-slate-500 uppercase mb-1.5"
                  >Per Halaman</label
                >
                <select
                  id="limitPage"
                  class="w-full px-3 py-2 border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-slate-50"
                >
                  <option value="10">10</option>
                  <option value="25" selected>25</option>
                  <option value="50">50</option>
                  <option value="999999">Semua</option>
                </select>
              </div>
              <button
                id="resetFilterBtn"
                class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-2 text-slate-600"
              >
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
              </button>
            </div>
            <!-- Kanan: Pencarian -->
            <div class="w-full lg:w-72 relative">
              <label
                class="block text-xs font-semibold text-slate-500 uppercase mb-1.5"
                >Cari Model</label
              >
              <div class="absolute right-3 top-[38px] text-slate-400">
                <i data-lucide="search" class="w-4 h-4"></i>
              </div>
              <input
                type="text"
                id="searchInput"
                placeholder="Ketik nama model..."
                class="w-full pl-3 pr-9 py-2 border-slate-200 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-slate-50 text-sm"
              />
            </div>
          </div>

          <!-- Statistik Harga -->
          <div class="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div
              class="border border-slate-100 rounded-lg p-3 bg-slate-50 flex items-center gap-3"
            >
              <div class="p-2 bg-blue-100 rounded-md text-blue-600">
                <i data-lucide="list" class="w-5 h-5"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 font-medium">Total Data</p>
                <p id="statJumlah" class="text-lg font-bold text-slate-800">
                  0
                </p>
              </div>
            </div>
            <div
              class="border border-slate-100 rounded-lg p-3 bg-slate-50 flex items-center gap-3"
            >
              <div class="p-2 bg-emerald-100 rounded-md text-emerald-600">
                <i data-lucide="trending-up" class="w-5 h-5"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 font-medium">Tertinggi</p>
                <p id="statMax" class="text-sm font-bold text-slate-800">
                  Rp 0
                </p>
              </div>
            </div>
            <div
              class="border border-slate-100 rounded-lg p-3 bg-slate-50 flex items-center gap-3"
            >
              <div class="p-2 bg-red-100 rounded-md text-red-600">
                <i data-lucide="trending-down" class="w-5 h-5"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 font-medium">Terendah</p>
                <p id="statMin" class="text-sm font-bold text-slate-800">
                  Rp 0
                </p>
              </div>
            </div>
            <div
              class="border border-slate-100 rounded-lg p-3 bg-slate-50 flex items-center gap-3"
            >
              <div class="p-2 bg-purple-100 rounded-md text-purple-600">
                <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
              </div>
              <div>
                <p class="text-xs text-slate-500 font-medium">Rata-rata</p>
                <p id="statAvg" class="text-sm font-bold text-slate-800">
                  Rp 0
                </p>
              </div>
            </div>
          </div>
        </div>
        <div
          id="infoFilter"
          class="px-5 py-2 bg-blue-50 border-t border-blue-100 text-xs text-blue-700 font-medium hidden"
        ></div>
      </div>

      <!-- Loading -->
      <div
        id="loadingState"
        class="text-center py-16 text-slate-500 bg-white rounded-xl border border-slate-200 shadow-sm"
      >
        <svg
          class="animate-spin h-8 w-8 text-blue-500 mx-auto mb-3"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        Memuat data dari CSV...
      </div>

      <!-- Tabel Responsif -->
      <div
        class="table-container shadow-sm rounded-xl overflow-auto border border-slate-200 bg-white hidden"
        id="tableContainer"
      >
        <table class="min-w-full text-sm">
          <thead
            class="bg-slate-50 text-slate-600 uppercase text-xs border-b border-slate-200"
            id="tableHeader"
          ></thead>
          <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <!-- Pagination Controls -->
      <div
        id="paginationControls"
        class="flex flex-col sm:flex-row justify-between items-center mt-4 gap-4 hidden"
      >
        <div
          class="text-sm text-slate-500 font-medium"
          id="paginationInfo"
        ></div>
        <div class="flex gap-1 items-center">
          <button
            id="prevPageBtn"
            class="p-2 border border-slate-200 rounded-md bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition"
          >
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <div id="pageNumbers" class="flex gap-1 text-sm"></div>
          <button
            id="nextPageBtn"
            class="p-2 border border-slate-200 rounded-md bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition"
          >
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div
        class="text-center text-xs text-slate-400 mt-8 pt-4 border-t border-white/30"
      >
        Dibuat oleh
        <span class="font-medium text-slate-600">Muhammad Riduwan Khafidi</span>
        —
        <a
          href="https://github.com/mroczect/plafon-end-user-jg"
          target="_blank"
          class="text-blue-500 hover:underline"
          >github.com/mroczect/plafon-end-user-jg</a
        >
      </div>
    </div>
  </body>
</html>
